<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connected</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      text-align: center;
      padding: 48px 56px;
      border: 1px solid #27272a;
      border-radius: 20px;
      background: #18181b;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 8px rgba(34,197,94,.12), 0 0 18px #22c55e;
      margin: 0 auto 18px;
    }
    h1 {
      font-size: 42px;
      letter-spacing: .04em;
      font-weight: 700;
    }
    p {
      margin-top: 10px;
      color: #a1a1aa;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Connected</h1>
    <p>sentinel is linked and ready.</p>
  </div>
</body>
</html>
